<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flight Computer MK-1</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="computer">

        <h1>✈ FLIGHT COMPUTER MK-1</h1>

        <div class="display">

            <p id="altitude">ALTITUDE: --- ft</p>

            <p id="heading">HEADING: ---°</p>

            <p id="airspeed">AIRSPEED: --- kts</p>

            <p id="fuel">FUEL: ---%</p>

            <p id="gear">GEAR: ---</p>

            <p id="warning">STATUS: NORMAL</p>

        </div>

        <!-- This is the button -->

        <button id="runButton" onclick="runFlight()">

            RUN FLIGHT CHECK

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
