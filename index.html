<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flight Computer MK-1</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="computer">

    <h1>✈ FLIGHT COMPUTER MK-1</h1>

    <div class="display">

        <div class="instrument">

            <h2>ALTITUDE</h2>

            <p id="altitude">--- ft</p>

            <p id="altitudeStatus">----------</p>

        </div>

        <div class="instrument">

            <h2>HEADING</h2>

            <p id="heading">---°</p>

            <p id="headingStatus">----------</p>

        </div>

        <div class="instrument">

            <h2>AIRSPEED</h2>

            <p id="airspeed">--- kts</p>

            <p id="speedStatus">----------</p>

        </div>

        <div class="instrument">

            <h2>FUEL</h2>

            <p id="fuel">---%</p>

        </div>

        <div class="instrument">

            <h2>LANDING GEAR</h2>

            <p id="gear">----------</p>

        </div>

    </div>

    <div class="warnings">

        <div id="fuelLight" class="warning fuelOff">

            FUEL WARNING

        </div>

        <div id="gearLight" class="warning gearOff">

            GEAR DOWN WARNING

        </div>

    </div>

    <button onclick="runFlight()">

        RUN FLIGHT CHECK

    </button>

</div>

<script src="script.js"></script>

</body>

</html>
